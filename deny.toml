# cargo-deny — supply-chain policy (PRD § 2 Security, § 7 NFR Security).
#
# The product is proprietary and source-available, ships unsigned installers,
# and makes hard public claims about containing no AI and doing no networking.
# This file is what keeps a transitive dependency from quietly falsifying any
# of that.

[graph]
# The three platforms that actually ship. Checking all of them means a
# Linux-only dependency cannot slip past a Windows-only run.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false

[advisories]
version = 2
yanked = "deny"

# Every entry here is an *unmaintained* advisory, not a vulnerability — checked
# 2026-07-31: `cargo deny check advisories` reports zero `error[vulnerability]`.
# None is something this project can drop or upgrade on its own; the goal state
# is an empty list.
#
# Six entries left with `src-tauri`. `cargo deny` reports an unmatched ignore as
# `advisory-not-detected`, which is what identified them — an ignore that no
# longer matches anything is a standing permission for an advisory to reappear
# unnoticed, so they are deleted rather than kept "just in case".
#
# A real vulnerability must never be added here — fix or replace the dependency.
ignore = [
    # RUSTSEC-2024-0375 — `atty` is unmaintained; its own maintainer says to
    # use `std::io::IsTerminal` instead. Not a vulnerability. It arrives
    # through `nih_log` <- `nih_plug` and does nothing but detect whether a TTY
    # is attached for dev logging, which the shipped plugin — running inside a
    # DAW, with no terminal — never benefits from either way.
    #
    # **It has a name: `nih-plug` is unmaintained upstream as of May 2026.** An unmaintained framework is
    # how a project inherits advisories it cannot close, and this is the first.
    # It belongs in TASK-P11's migration decision rather than being quietly
    # carried.
    "RUSTSEC-2024-0375",
    # gtk-rs GTK3 bindings, unmaintained upstream. The vendored webview
    # adapter's Linux path is WebKitGTK, which requires them; there is no GTK4
    # path yet.
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # proc-macro-error, unmaintained; a build-time-only transitive dependency.
    "RUSTSEC-2024-0370",
]

[licenses]
version = 2
# Permissive licences only. Strong copyleft (GPL/AGPL) is incompatible with a
# proprietary source-available product and must never appear.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "NCSA",
    "CDLA-Permissive-2.0",
    "MIT-0",
    # Public-domain dedication, no conditions at all. Used by `midly`, the SMF
    # writer (PRD § 13).
    "Unlicense",
]
confidence-threshold = 0.9

# This workspace's own crates are `publish = false` and carry the proprietary
# LicenseRef-AllRightsReserved, which is not an SPDX identifier and never will
# be. Checking our own licence against an allowlist of third-party licences is
# meaningless — the policy exists to police dependencies.
private = { ignore = true }

# MPL-2.0 is file-level copyleft: linking is fine, and we ship those files
# unmodified. If one ever needs modifying, that change must be published.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# ...except between our own crates. The ban exists to stop an unbounded version
# requirement on a *registry* crate, where "any version" means whatever the
# index serves tomorrow. A path dependency inside this workspace resolves to the
# copy in this repo and nothing else, so there is no range to pin.
#
# Pinning them anyway is what this replaced: `engine = { path, version = "0.1.0" }`
# in three manifests, each of which had to be bumped in lockstep with the
# workspace version. The first release after 0.1.0 stopped resolving because
# they were not, which is a build break bought for no safety at all.
allow-wildcard-paths = true
# Nothing may depend on the engine except through its public API — a build
# script reaching into it would break the "engine is pure" invariant.
highlight = "all"

# Belt and braces alongside scripts/check-denylist.mjs. That script reasons
# about the build graph; this refuses the crates outright.
deny = [
    { name = "onnxruntime" },
    { name = "ort" },
    { name = "tract-onnx" },
    { name = "tch" },
    { name = "torch-sys" },
    { name = "candle-core" },
    { name = "candle-nn" },
    { name = "burn-core" },
    { name = "rust-bert" },
    { name = "llm-chain" },
    { name = "llama-cpp-sys" },
    { name = "tensorflow" },
    { name = "openai-api-rs" },
    { name = "async-openai" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# The plugin's framework is not on crates.io. Each of these is named
# individually rather than the gate being relaxed, because "some git
# dependency" is exactly the thing this check exists to notice — and every one
# of them is pinned to a revision in the manifest that names it.
#
# **`nih-plug` is our own fork**, and TASK-P11 records why we own one: upstream
# is in maintenance mode and will not take the fix, and `nice-plug` — the
# maintained community fork — carries the identical bug, so migrating was not an
# escape from it. The fork is upstream's `f36931f7` plus exactly one commit
# bounding the CLAP state length prefix, without which a corrupt project file
# aborts the host process. See `patches/nih-plug-state-load-bounds.patch`.
#
# Upstream's URL is deliberately **not** listed: leaving it here would let a
# manifest silently drift back to the unpatched crate and this gate would say
# nothing. `cargo deny` also warns when an allowed source goes unused, which is
# what would catch it.
#
# `baseview` is here only because the vendored `nih_plug_webview` needs a
# revision predating its raw-window-handle 0.6 migration — see
# plugin/vendor/VENDORED.md.
allow-git = [
    "https://github.com/MikesRuthless12/nih-plug",
    "https://github.com/RustAudio/baseview",
    # The CLAP bindings nih-plug builds on. Pinned by nih-plug itself.
    "https://github.com/micahrj/clap-sys",
]
