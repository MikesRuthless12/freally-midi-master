[package]
name = "freally-midi-master-plugin"
description = "Freally MIDI Master as a CLAP/VST3 plugin. Generates artist-accurate MIDI onto the host's track, in the host's key and tempo."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Both, deliberately. `cdylib` is what a host loads; `lib` is what the tests and
# any future standalone build link against. Without the `lib` crate type the
# integration tests cannot see this crate at all.
crate-type = ["cdylib", "lib"]

# The standalone's Windows icon and version strings. See `build.rs` — Windows
# only, and a missing resource compiler warns rather than failing the build.
#
# ⛔ **Pinned exactly, unlike the runtime dependencies below.** This one runs at
# *build* time and shells out to `rc.exe`, so a new release of it executes on
# this machine and on CI before any of our own code does — the one dependency
# where "whatever 0.1.x resolves today" is a supply-chain question rather than a
# compatibility one. `Cargo.lock` already fixes the version for a normal build;
# this is what stops a routine `cargo update` from moving it silently. Same
# reasoning as the `rev` pins on `nih_plug` and `baseview`.
[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

# The Windows half of the drag-out (TASK-063C / FMM-S03). See `plugin/src/drag`.
#
# ⛔ **Not a new crate in the build.** `wry` already pulls `windows` 0.61
# through `webview2-com`, so this unifies with the copy that is here rather
# than adding one — the reason `windows_pump` in the vendored adapter declared
# its two `user32` functions by hand no longer applies once the crate is in the
# graph regardless.
#
# ⚠ **`windows::core::implement` is why this is the `windows` crate and not two
# more `extern "system"` declarations.** `IDropSource` has to be a real COM
# object, and hand-rolled vtables with hand-rolled reference counting run
# **inside Ableton's process** — a refcount slip there is a use-after-free in
# somebody else's DAW. The generated implementation is the safe half of a job
# whose unsafe half is unavoidable. (It needs no feature flag: the macro comes
# through `windows-core`, which is always present.)
#
# MIT OR Apache-2.0, already on `deny.toml`'s allowlist, and it links no HTTP
# client, so `scripts/check-denylist.mjs` is unaffected.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    # The drag image is a 32-bit DIB section the shell's drag helper blends.
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    # ⛔ **`STGMEDIUM` and `STGMEDIUM_0` are gated on this**, and `drag/windows.rs`
    # constructs both by hand. Neither `Win32_System_Com` nor `Win32_System_Ole`
    # implies it. The build worked without it only because `wry` happens to
    # enable it and Cargo unifies features — so a `wry` bump that dropped it, or
    # any configuration without `wry` in the graph, would have broken the one
    # platform this feature ships on, from an unrelated dependency change.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

# ⚠ **Named, because `#[implement]` expands to absolute `::windows_core::`
# paths** — the macro cannot be used without the crate being in scope under
# that exact name, and a `use windows::core as windows_core` alias does not
# satisfy an absolute path. It resolves to the same 0.61.2 `windows` 0.61.3
# already depends on, so this adds a name to the manifest and nothing to the
# build. ⛔ Keep the two in step: a `windows` bump that moves `windows-core`
# with it will produce a second copy and the macro will fail on a trait bound
# from "a different version of the same crate", which reads as nonsense.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.61"

[dependencies]
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The dataset and the built UI are compiled into the binary. A plugin is a
# shared library in someone else's process: it has no resource directory, no
# install layout it can rely on and no working directory it chose.
include_dir = "0.7"
# Directly, for the custom-protocol handler's own return type. The vendored
# adapter re-exports `wry::http` but not `wry` itself, and reaching for it here
# keeps the edits to that crate down to the ones VENDORED.md accounts for.
# Cargo unifies this with the adapter's copy; they must stay the same minor.
wry = "0.35.1"

# VST3 and AU, projected from the CLAP rather than implemented again.
#
# This is what makes the plugin loadable in **Ableton, Logic, Pro Tools and
# Cubase**, none of which speak CLAP. It is also the licence-clean route:
# MIT/Apache-2.0 over Steinberg's own VST3 SDK (MIT since November 2025) and
# Apple's AudioUnitSDK — as opposed to nih-plug's VST3 export, which links the
# GPLv3 `vst3-sys` and is disabled for that reason.
#
# No CMake; it compiles the C++ shim with the `cc` crate, using the same MSVC
# toolchain the Rust build already requires.
clap-wrapper = { version = "0.3.1", features = ["vst3"] }
# The native Save As dialog a song is exported through (TASK-073).
#
# ⛔ **`default-features = false` with `xdg-portal`, and the reason is Linux.**
# The default backend links GTK3, which would make the plugin refuse to load in
# any host that has already initialised a different GTK version — and would put
# a desktop toolkit inside a shared library loaded into someone else's process.
# The portal backend talks to the desktop's own file-chooser over D-Bus instead,
# which is what a sandboxed application is supposed to do and pulls no toolkit.
# Windows and macOS use their platform dialogs either way.
#
# ⚠ It is **not** a network dependency and `scripts/check-denylist.mjs` still
# passes with an empty allowlist — the gate's whole point is that no HTTP client
# is linked, and this adds none.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Decoding the one-shots a producer assigns to a part (TASK-131B).
#
# ⛔ **Not for the shipped kit.** `audio::kit::decode_wav` still reads that, and
# deliberately: those bytes are `kitgen`'s own output in a format this repo
# controls exactly, and its decoder is the gate that catches a kit shipping
# broken. This is for the other case — a file off somebody's disk, in whatever
# their sample pack happened to use.
#
# `default-features = false` and every format named explicitly, because the
# default set pulls video and subtitle codecs a sampler has no use for. What is
# here is what a one-shot actually arrives as: WAV and AIFF uncompressed, FLAC
# and ALAC lossless, MP3, Vorbis and AAC lossy, in their MP4/Ogg containers.
# `id3v2` is not a format — it is what lets an MP3 carrying cover art be read
# at all rather than failing on its own tag.
#
# ⚠ Pure Rust with no `unsafe`-heavy C decoder behind it, which matters more
# than usual here: this parses **untrusted files** inside somebody else's DAW
# process, where a memory-safety bug in a decoder is a crash in Ableton.
# MPL-2.0, which `deny.toml` already allows and already explains; it links no
# HTTP client, so `scripts/check-denylist.mjs` is unaffected.
symphonia = { version = "0.6.0", default-features = false, features = [
    "wav",
    "pcm",
    "adpcm",
    "aiff",
    "flac",
    "mp3",
    "id3v2",
    "isomp4",
    "aac",
    "alac",
    "ogg",
    "vorbis",
] }

# Git rather than crates.io because that is the only place nih-plug is
# published. Pinned to a revision for the same reason `rust-toolchain.toml`
# pins the compiler: an unpinned plugin framework re-resolves on every clean
# build, and a plugin that stops loading in a DAW is the hardest kind of
# regression to attribute after the fact.
# CLAP only. `default-features = false` drops nih-plug's VST3 export, and with
# it `vst3-sys` — a third-party Rust reimplementation of the VST3 interfaces
# licensed **GPLv3**, which is incompatible with this project's proprietary,
# All-Rights-Reserved licence. (Steinberg's own VST3 SDK went MIT in November
# 2025; nih-plug does not use it.) `cargo deny` catches this, and it caught it
# here.
#
# VST3 and AU are projected from the CLAP by `clap-wrapper` instead — MIT and
# Apache-2.0 respectively, over Steinberg's MIT SDK and Apple's AudioUnitSDK.
# See TASK-P08.
#
# `standalone` is opted back in deliberately: it is what lets the plugin run as
# an ordinary window with no DAW at all, which is how it gets tested day to day
# (`npm run plugin:standalone`). It does not pull `vst3-sys`.
#
# **Our fork, and TASK-P11 explains why we own one.** It is upstream's
# `f36931f7` plus exactly one commit: a bounds check on the CLAP state length
# prefix. Without it `ext_state_load` hands an untrusted `u64` straight to
# `Vec::with_capacity`, so a corrupt project file decodes to a ~1 exabyte
# allocation and **Rust aborts the process** — an abort no host can catch, which
# takes the whole DAW down. `clap-validator`'s `state-invalid-random` found it.
#
# Upstream is in maintenance mode and will not take it; `nice-plug`, the
# maintained community fork, carries the identical bug, so migrating was not an
# escape from this. Rebasing onto anything newer is a diff against one commit.
[dependencies.nih_plug]
git = "https://github.com/MikesRuthless12/nih-plug.git"
rev = "10bac6da816c6b95041cb6698d74eb465f60341f"
default-features = false
features = ["standalone"]

# The editor. Vendored rather than fetched, because upstream depends on an
# unpinned `baseview` that has since moved to raw-window-handle 0.6 and no
# longer compiles it — and an unpinned git dep inside a dep cannot be pinned
# from outside. `plugin/vendor/VENDORED.md` has the full reason and what has to
# happen for it to go away.
[dependencies.nih_plug_webview]
path = "vendor/nih-plug-webview"
