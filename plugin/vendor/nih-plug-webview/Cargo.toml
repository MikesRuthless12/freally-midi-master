[package]
name = "nih_plug_webview"
version = "0.0.0"
edition = "2021"
authors = ["Max Huttunen <max.huttunen@gmail.com>"]
license = "ISC"
publish = false

description = "An adapter to use webview GUIs with NIH-plug. Vendored — see VENDORED.md."

# Third-party source. It is no longer byte-for-byte upstream — see VENDORED.md
# for the two behaviours that changed and the Linux module that is entirely ours
# — but it is still mostly someone else's code, and linting it under
# `-D warnings` would mean either rewriting it or a permanently red gate.
[lints.clippy]
all = "allow"

[dependencies]
parking_lot = "0.12.1"
serde_json = "1.0"
wry = { version = "0.35.1" }
raw-window-handle = "0.5"
crossbeam = "0.8.2"
keyboard-types = "0.6.2"

# The same revision the rest of the workspace pins, so there is one nih_plug in
# the build rather than two that cannot pass types to each other.
# `default-features = false` for the licence reason documented in
# `plugin/Cargo.toml`: nih-plug's VST3 export pulls GPLv3 `vst3-sys`. Both
# manifests must agree, or cargo unifies the feature back on and the GPL
# dependency returns through this crate instead.
# ⛔ Must be the SAME source and rev as `plugin/Cargo.toml`. Two different
# `nih_plug` sources are two different crates to cargo, so the `Editor` this
# adapter implements would not be the `Editor` the plugin expects — and the
# error points at a trait mismatch rather than at a duplicated dependency.
# See TASK-P11 for why that source is our fork.
nih_plug = { git = "https://github.com/MikesRuthless12/nih-plug.git", rev = "10bac6da816c6b95041cb6698d74eb465f60341f", default-features = false }

# THE REASON THIS CRATE IS VENDORED.
#
# Upstream depends on `baseview` from git with **no revision pin**, so cargo
# resolves whatever HEAD happens to be. On 2026-06-19 baseview's `858113b`
# migrated to `raw-window-handle` 0.6, and `cc28453` then moved its size types
# to the `dpi` crate. Upstream's code — written against raw-window-handle 0.5
# and `baseview::Size` — stopped compiling entirely: nine errors, none of them
# in ours, on a dependency nobody can pin from the outside.
#
# `91e3b4a` is baseview 0.1.4 (2026-06-17), the last revision before that
# migration and the one this crate was actually written against.
#
# Pinned here rather than `[patch]`ed from the workspace because cargo refuses
# a patch that points at the same source URL as the dependency it replaces.
[dependencies.baseview]
git = "https://github.com/RustAudio/baseview"
rev = "91e3b4a50f1db712355ba0d991c02d024050ef40"

# Linux only, and only so that GTK can be started before wry reaches for
# `gdk::Display::default()` — which is `None` until someone has called
# `gtk_init`, and a plugin cannot require its host to be a GTK application.
#
# ⛔ Must stay the same minor as wry's own `gtk`, which is 0.18. Two gtk crates
# would be two sets of `IS_MAIN_THREAD` thread-locals, so our `init()` would not
# be the initialisation wry's assertions look for, and every call would fail an
# assert that reads as though GTK was never started at all.
#
# `src/linux.rs` explains why this is one thread per process rather than one per
# window: gtk-rs *panics* on a second `init()` from a different thread, and
# baseview spawns a fresh thread for every editor.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
