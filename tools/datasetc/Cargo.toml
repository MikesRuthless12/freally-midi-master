[package]
name = "datasetc"
description = "Validate, lint and report on the Freally MIDI Master style dataset."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Path only: a `version` requirement here has to be bumped in lockstep with
# the workspace version or the build stops resolving, and `engine` is
# `publish = false`, so it bought nothing.
engine = { path = "../../engine" }
serde_json = "1"
# default-features = false keeps the optional HTTP/file reference resolvers out.
# Remote $ref resolution would put a network client in the build, which the CI
# denylist forbids and the dataset has no use for — every $ref here is local.
jsonschema = { version = "0.48", default-features = false }
