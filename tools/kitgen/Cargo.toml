[package]
name = "kitgen"
description = "Synthesizes Freally MIDI Master's preview one-shot kits from scratch."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Path only: a `version` requirement here has to be bumped in lockstep with
# the workspace version or the build stops resolving, and `engine` is
# `publish = false`, so it bought nothing.
engine = { path = "../../engine" }
serde_json = "1"
rand = "0.9"
rand_chacha = "0.9"
