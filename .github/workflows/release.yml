name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# ⛔ THE DESKTOP APP IS RETIRED. This workflow ships the **plugin** and nothing
# else. The `build` job that ran `tauri-action` — three OS installers, the
# `latest.json` updater manifest and the signing keys — is gone, along with the
# unsigned-installer instructions in the release notes.
#
# What that means for the people already on v0.2.0: their updater points at this
# channel and will simply stop finding new versions. It does not break, and
# nothing they have installed stops working. Say so in the CHANGELOG section for
# whichever release retires it, because the update prompt is the only channel
# that reaches them and it will go quiet without explanation otherwise.
#
# `src-tauri/` is still in the tree: it generates `ipc-audio-types.ts`, which the
# frontend imports, and it is the standalone audio path. Removing the crate is a
# separate piece of surgery from removing the *product*.

jobs:
  # Windows and macOS only, matching CI: Linux has no editor until TASK-P12.
  plugin:
    name: plugin (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-plugin-${{ matrix.label }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Frontend, release cdylib, `assert-plugin-bundled` refusing a binary with
      # no UI or dataset in it, then the `.clap`/`.vst3` layout.
      - name: Build the plugin bundles
        run: npm run plugin:bundle

      - uses: ./.github/actions/install-clap-validator

      # Before publishing, not after. This project already refuses to announce a
      # release whose downloads have not been fetched and checked
      # (`verify-downloads.yml`); shipping a plugin no validator has opened
      # would be the same gap one layer down.
      #
      # The two exclusions are the ones `ci.yml` carries, for the same reasons
      # and with the same instruction: delete each the moment its cause is gone.
      - name: clap-validator
        shell: bash
        run: |
          set -euo pipefail
          "$CLAP_VALIDATOR" validate \
            --exclude '^param-conversions$' \
            "target/bundled/Freally MIDI Master.clap"

      # Zipped because a VST3 is a bundle *directory* on every platform and a
      # CLAP is one on macOS. A release asset is a single file, so an unzipped
      # bundle cannot be uploaded at all — and a user who unpacks it gets the
      # directory the host is looking for.
      #
      # Split per OS for one unglamorous reason: **`zip` does not exist on the
      # Windows runner.** Git for Windows' bash does not ship it, so a single
      # `shell: bash` step would fail the first time a tag was pushed — on the
      # release path, which is the worst place to find out.
      - name: Package the bundles (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-assets | Out-Null
          Compress-Archive -Force -DestinationPath 'dist-assets/freally-midi-master-plugins-windows.zip' -Path @(
            'target/bundled/Freally MIDI Master.clap',
            'target/bundled/Freally MIDI Master.vst3'
          )
          Get-Item dist-assets/*.zip | Select-Object Name, Length

      - name: Package the bundles (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          (cd target/bundled && zip -qr "$GITHUB_WORKSPACE/dist-assets/freally-midi-master-plugins-macos.zip" \
            "Freally MIDI Master.clap" "Freally MIDI Master.vst3")
          ls -la dist-assets

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.label }}
          path: dist-assets/
          if-no-files-found: error
          retention-days: 1

  draft:
    name: draft release
    needs: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: plugins-*
          merge-multiple: true
          path: dist-assets

      # The one string a user cannot see any other way. A hardcoded "see the
      # release notes" would be worse than useless.
      #
      # Matched LITERALLY, not as a regex: `## [0.1.0]` compiled as a pattern is
      # a character class over `0.1`, with the dots as wildcards — it silently
      # matches nothing and every release quietly ships a generic note.
      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before tagging."
            exit 1
          fi

          cat >> notes.md <<'NOTES'

          ---

          ### Installing

          Each zip holds a **CLAP** and a **VST3**. Unzip and put each in its own
          folder — a `.clap` in a VST3 folder is invisible to every host, and the
          reverse shows an empty browser:

          - **CLAP** — `%COMMONPROGRAMFILES%\CLAP` on Windows,
            `/Library/Audio/Plug-Ins/CLAP` on macOS. Loaded by Bitwig, Reaper,
            FL Studio 21.2+, Studio One 6.5+ and Renoise.
          - **VST3** — `%COMMONPROGRAMFILES%\VST3` on Windows,
            `/Library/Audio/Plug-Ins/VST3` on macOS. This is what **Ableton Live,
            Logic, Pro Tools and Cubase** load; none of them speaks CLAP.

          Then rescan plugins in your DAW. Linux is not built yet.

          The binaries are unsigned by policy — this project spends nothing, ever,
          and code-signing certificates cost money. Checksums are published as
          `SHA256SUMS`, and every asset is downloaded and verified by CI before
          the release is announced.
          NOTES

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist-assets
          rm -f SHA256SUMS
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # Created as a draft, never published here. `verify-downloads.yml` fetches
      # every asset and checks it opens before a human publishes — which is why
      # drafts need `contents: write` to be visible to the API at all.
      #
      # Never interpolate ${{ }} into a run: block — GitHub splices the value
      # into the shell source before bash parses it, and a ref name may contain
      # quotes, semicolons and backticks. Pass it through env: instead.
      - name: Create or update the draft
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file notes.md --draft
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
              --clobber dist-assets/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "Freally MIDI Master ${TAG#v}" \
              --notes-file notes.md \
              dist-assets/*
          fi
