name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-universal
            # One universal binary rather than two downloads the user has to
            # choose between.
            args: '--target universal-apple-darwin'
          - os: ubuntu-latest
            label: linux
            args: ''
          - os: windows-latest
            label: windows
            args: ''

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.label }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The updater shows these notes in-app, and they are the one string a
      # user cannot see any other way. A hardcoded "see the release notes"
      # would be worse than useless.
      #
      # Matched LITERALLY, not as a regex: `## [0.1.0]` compiled as a pattern
      # is a character class over `0.1`, with the dots as wildcards — it
      # silently matches nothing and every release quietly ships a generic note.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes=$(awk -v want="## [$version]" '
            index($0, want) == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Add one before tagging — without it every user sees a generic update note."
            exit 1
          fi

          {
            echo 'body<<CHANGELOG_EOF'
            printf '%s\n' "$notes"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing. Without these the updater refuses the manifest, so
          # a release built without them is one no existing user can install.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Freally MIDI Master __VERSION__'
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ---

            ### The plugin

            `freally-midi-master-plugins-windows.zip` and
            `-macos.zip` each contain a **CLAP** and a **VST3**. Unzip and put
            each one in its own folder — a `.clap` in a VST3 folder is invisible
            to every host, and the reverse is what shows an empty browser:

            - **CLAP** — `%COMMONPROGRAMFILES%\CLAP` on Windows,
              `/Library/Audio/Plug-Ins/CLAP` on macOS. Loaded by Bitwig, Reaper,
              FL Studio 21.2+, Studio One 6.5+ and Renoise.
            - **VST3** — `%COMMONPROGRAMFILES%\VST3` on Windows,
              `/Library/Audio/Plug-Ins/VST3` on macOS. This is what **Ableton
              Live, Logic, Pro Tools and Cubase** load; none of them speaks CLAP.

            Then rescan plugins in your DAW. Linux is not built yet.

            ---

            **Installers are unsigned by policy** — this project spends nothing,
            ever, and code-signing certificates cost money. First run therefore
            needs one extra step:

            - **Windows** — SmartScreen appears: *More info* → *Run anyway*.
            - **macOS** — right-click the app → *Open* → *Open*. Opening by
              double-click alone will be refused.
            - **Linux** — `chmod +x` the AppImage before running it.

            Checksums are published as `SHA256SUMS` alongside the installers.
            Every asset on this release is downloaded and verified by CI before
            the release is announced.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The plugin, which is what the project ships now.
  #
  # A separate job from `build` because it is a different artefact built a
  # different way: `tauri-action` produces installers for the desktop app, and
  # this produces the `.clap` and `.vst3` a DAW loads. It runs after `build`
  # only because that is what creates the draft release these upload to.
  #
  # Windows and macOS only, matching CI: Linux has no editor until TASK-P12.
  plugin:
    name: plugin (${{ matrix.label }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-plugin-${{ matrix.label }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Frontend, release cdylib, `assert-plugin-bundled` refusing a binary with
      # no UI or dataset in it, then the `.clap`/`.vst3` layout.
      - name: Build the plugin bundles
        run: npm run plugin:bundle

      - uses: ./.github/actions/install-clap-validator

      # Before publishing, not after. This project already refuses to announce a
      # release whose downloads have not been fetched and checked
      # (`verify-downloads.yml`); shipping a plugin no validator has opened
      # would be the same gap one layer down.
      #
      # The two exclusions are the ones `ci.yml` carries, for the same reasons
      # and with the same instruction: delete each the moment its cause is gone.
      # `state-invalid-random` aborts inside nih-plug's `ext_state_load`;
      # `param-conversions` divides by a parameter count this plugin does not
      # have, and the validator says so itself.
      - name: clap-validator
        shell: bash
        run: |
          set -euo pipefail
          "$CLAP_VALIDATOR" validate \
            --exclude '^(state-invalid-random|param-conversions)$' \
            "target/bundled/Freally MIDI Master.clap"

      # Zipped because a VST3 is a bundle *directory* on every platform and a
      # CLAP is one on macOS. A release asset is a single file, so an unzipped
      # bundle cannot be uploaded at all — and a user who unpacks it gets the
      # directory the host is looking for.
      - name: Package the bundles
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          cd target/bundled
          zip -qr "$RUNNER_TEMP/freally-midi-master-plugins-$LABEL.zip" \
            "Freally MIDI Master.clap" "Freally MIDI Master.vst3"
          ls -la "$RUNNER_TEMP/freally-midi-master-plugins-$LABEL.zip"

      # Uploaded to the draft `build` created. Never interpolate `${{ }}` into a
      # run: block — GitHub splices the value into the shell source before bash
      # parses it, and a ref name may contain quotes, semicolons and backticks.
      - name: Attach to the draft release
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          LABEL: ${{ matrix.label }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "$RUNNER_TEMP/freally-midi-master-plugins-$LABEL.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: checksums
    needs: [build, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Never interpolate ${{ }} into a run: block — GitHub splices the value
      # into the shell source before bash parses it, and a ref name may contain
      # quotes, semicolons and backticks. Pass it through env: instead.
      - name: Generate SHA256SUMS
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-assets && cd dist-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --clobber
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
