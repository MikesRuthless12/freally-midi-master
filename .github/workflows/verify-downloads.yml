name: Verify downloads

# DoD gate #11 (PRD § 7.6): every published asset must download, match its
# checksum, and open. A release whose installer is truncated or corrupt is
# worse than no release — it burns the one chance a new user gives you.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify'
        required: true

# `write`, reluctantly, and only so the job can SEE a draft: GitHub shows draft
# releases exclusively to tokens with push access. The job itself only reads —
# it downloads assets and checks them. Verifying before publishing is worth the
# scope; verifying after is verifying the wrong thing.
permissions:
  contents: write

jobs:
  verify:
    name: verify assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Downloaded through the API, not `gh release download`, because that
      # command cannot see a DRAFT release — it answers "release not found".
      # Verifying only after publishing is the wrong order: PRD § 7.6 gate 11
      # exists so a broken release is never announced, and by the time it is
      # published it has been. The API lists drafts, so this works on the
      # staged release and on a published one alike.
      - name: Download every asset
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets

          # `--jq` runs per page, so a `map(...) | first` would emit one result
          # PER PAGE — nulls for the pages without a match. Select and take the
          # first line instead, which is correct however many pages there are.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate             --jq ".[] | select(.tag_name == \"$TAG\")" | head -1)
          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo "::error::no release (draft or published) tagged $TAG"
            exit 1
          fi
          echo "draft=$(printf '%s' "$release" | jq -r .draft)"

          count=$(printf '%s' "$release" | jq '.assets | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::$TAG has no assets at all"
            exit 1
          fi

          printf '%s' "$release" | jq -r '.assets[] | "\(.id)	\(.name)"' |
            while IFS=$'	' read -r id name; do
              # `Accept: application/octet-stream` on the asset endpoint returns
              # the bytes; without it the API returns the asset's JSON metadata,
              # which would then cheerfully fail its checksum.
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id"                 -H 'Accept: application/octet-stream' > "$name"
            done

          echo "Downloaded:"
          ls -la

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd assets
          if [ ! -f SHA256SUMS ]; then
            echo "::error::SHA256SUMS is missing from the release."
            exit 1
          fi
          # Ignore the checksum file's own line if it happens to be present.
          grep -v ' SHA256SUMS$' SHA256SUMS > to-check.txt || true
          if [ ! -s to-check.txt ]; then
            echo "::error::SHA256SUMS lists no assets."
            exit 1
          fi
          sha256sum -c to-check.txt

      - name: Every expected platform is present
        run: |
          set -euo pipefail
          cd assets
          fail=0
          # A release missing a platform is a silent regression: the download
          # page still looks fine, and only that platform's users notice.
          #
          # The desktop installers (`*.exe`, `*.msi`, `*.dmg`, `*.AppImage`,
          # `*.deb`) are gone deliberately — the desktop app is retired and
          # `release.yml` no longer builds it. Requiring them here would fail
          # every release from now on.
          for pattern in 'freally-midi-master-plugins-windows.zip' \
                         'freally-midi-master-plugins-macos.zip'; do
            # shellcheck disable=SC2086
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::error::no asset matching $pattern"
              fail=1
            fi
          done
          exit $fail

      - name: The plugin bundles actually open
        run: |
          set -euo pipefail
          cd assets
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

          fail=0
          # One enumeration per plugin zip, answering both questions: that it
          # opens at all, and that **both formats are in it**. One binary
          # produces the `.clap` and the `.vst3`, so a zip carrying only one is
          # a packaging bug rather than a choice — and it is invisible until a
          # producer on the wrong DAW finds nothing to load. Ableton, Logic,
          # Pro Tools and Cubase need the VST3; Bitwig, Reaper and FL Studio
          # take the CLAP.
          for f in freally-midi-master-plugins-*.zip; do
            [ -e "$f" ] || continue
            if ! listing=$(7z l "$f" 2>/dev/null); then
              echo "::error::$f did not open — it is corrupt or truncated"
              fail=1
              continue
            fi
            echo "ok   $f"
            for want in '.clap' '.vst3'; do
              if ! printf '%s' "$listing" | grep -q -- "$want"; then
                echo "::error::$f contains no $want — half the hosts can load nothing"
                fail=1
              fi
            done
          done

          # A zero-length or absurdly small archive passes a checksum quite
          # happily; the bytes just match the wrong thing. The plugin carries the
          # whole UI and dataset, so anything under a megabyte is not it.
          for f in freally-midi-master-plugins-*.zip; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is only $size bytes — too small to be a real bundle"
              fail=1
            fi
          done
          exit $fail

      - name: What to do if this failed
        if: failure()
        run: |
          cat <<'EOF'
          ::error::Release verification failed.

          Do not announce this release. Per PRD § 7.6 gate 11 the fix is:
            1. Fix the cause.
            2. Re-tag (a NEW version — the updater compares version numbers, so
               re-tagging an existing one reaches nobody).
            3. Re-release.
            4. Re-run this workflow until it is green.

          Runbook: docs/runbooks/release.md
          EOF
          exit 1
