name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just where we remembered to ask.
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the state of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Tauri's Linux runtime plus ALSA for the audio engine. Without these the
      # Linux leg fails at link time rather than at test time, which is a much
      # more confusing failure to read.
      # The X11 packages are for the plugin: `baseview` — the windowing layer
      # under the webview editor — links X11 on Linux, and without the headers
      # `x11 v2.21.0`'s build script fails before anything of ours compiles.
      # Nothing else in the workspace needs them.
      #
      # `libx11-xcb-dev` is the one that is easy to miss: the `x11` crate asks
      # pkg-config for `x11-xcb`, which `libx11-dev` does *not* provide. The
      # error names the crate rather than the package, so it reads like an X11
      # problem when it is an X11-to-XCB bridge problem.
      #
      # `libjack-jackd2-dev` is for nih-plug's `standalone` feature, which the
      # plugin opts into so it can run without a DAW. On Linux that reaches
      # JACK through `jack-sys`, so the headers are needed to *compile* the
      # plugin here even though CI never opens an audio device.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            patchelf \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcursor-dev \
            libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Otherwise the three OS legs fight over one cache key.
          key: ${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The plugin compiles `dist/` into its binary with `include_dir!`, and
      # `dist/` is gitignored — so on a fresh checkout it does not exist and
      # *nothing Rust* builds until Vite has run. This has to come before
      # cargo, not after it with the other frontend steps.
      - name: frontend build (the plugin embeds dist/)
        run: npm run build

      # ---- Rust ----------------------------------------------------------
      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # ts-rs writes both files during `cargo test`. They are committed so a
      # fresh clone can typecheck without running cargo, which means they can
      # drift. If a regenerated file differs from the committed one, the IPC
      # contract and the UI's view of it have diverged.
      #
      # Two files, one per crate, and they must stay separate: ts-rs truncates
      # the file it writes, so pointing `engine` and `src-tauri` at one path
      # made whichever ran last delete the other's types.
      - name: TypeScript bindings are up to date
        run: git diff --exit-code -- src/lib/ipc-types.ts src/lib/ipc-audio-types.ts

      # ---- Frontend ------------------------------------------------------
      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format check
        run: npm run format:check

      - name: unit tests
        run: npm run test

      # (`frontend build` used to sit here. It moved above the Rust steps when
      # the plugin started embedding `dist/`; running it twice would only
      # prove the same thing a second time.)

      # ---- Dataset -------------------------------------------------------
      # A malformed community model must fail here, not in a user's session.
      - name: validate dataset
        run: npm run dataset:validate

  # Proof, in pictures, that the Studio actually renders on each OS.
  #
  # Every other gate can pass while the window comes up blank or half-drawn:
  # the code compiles, the DOM tests pass against a browser, and nobody has
  # looked at the thing. This job launches the real app on all three runners
  # and uploads a screenshot each, so a human can see it.
  screenshots:
    name: screenshot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            xvfb \
            xdotool \
            imagemagick

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - uses: Swatinem/rust-cache@v2
        with:
          key: screenshot-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Linux runners have no display, so the app gets a virtual one. Windows
      # and macOS runners already have a real desktop session.
      - name: Capture (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1000x24" \
            node scripts/screenshot-app.mjs screenshots/linux.png

      - name: Capture (Windows)
        if: matrix.os == 'windows-latest'
        run: node scripts/screenshot-app.mjs screenshots/windows.png

      - name: Capture (macOS)
        if: matrix.os == 'macos-latest'
        run: node scripts/screenshot-app.mjs screenshots/macos.png

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: app-screenshot-${{ matrix.os }}
          path: screenshots/
          retention-days: 30
          if-no-files-found: error

  e2e:
    name: e2e
    # All three, because the language sweep captures a screenshot of the
    # Settings modal per locale and font rendering is the one thing that
    # genuinely differs per OS: each platform has its own text shaper, and a
    # script that lays out correctly on Linux can still break on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only. These specs drive `vite dev` with IPC mocked at the
      # `src/lib/ipc` seam, so no Tauri binary is built — the UI is what is
      # under test, and native behaviour is covered by the cargo tests and the
      # per-OS app screenshots instead.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      # One image per language, per OS: 17 locales x 3 platforms. This is the
      # evidence that the UI genuinely renders in every language it offers —
      # a green tick cannot show whether Arabic mirrored or Hindi drew its
      # conjuncts, and a human can see both in two seconds.
      - name: Check the language screenshots exist
        shell: bash
        run: |
          count=$(ls screenshots/i18n/*.png 2>/dev/null | wc -l)
          echo "captured $count language screenshots"
          if [ "$count" -lt 17 ]; then
            echo "::error::expected 17 language screenshots, found $count"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: language-screenshots-${{ matrix.os }}
          path: screenshots/i18n/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  # The plugin as a *plugin*, rather than as a crate that happens to compile.
  #
  # `quality` builds this same code through `cargo clippy --workspace`, which
  # proves it compiles and proves nothing about whether a host could load it.
  # Until this job existed, nothing in CI ever produced a loadable bundle, and
  # `clap-validator` had never run anywhere — not in CI and not on a dev
  # machine, because the binary was never installed on one. The CLAP contract
  # was entirely unchecked.
  #
  # Windows and macOS only: those are the v1 platforms. Linux has no editor
  # until TASK-P12, so there is nothing there worth loading yet.
  plugin:
    name: plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - uses: Swatinem/rust-cache@v2
        with:
          key: plugin-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Frontend, then the release cdylib, then `assert-plugin-bundled` refusing
      # a binary with no UI or no dataset in it, then the `.clap`/`.vst3` layout.
      # `--bundle-only`, because a runner has no plugin folder worth writing to.
      - name: Build the plugin bundles
        run: npm run plugin:bundle

      # Shared with `release.yml`, so the same validator gates a push and a tag.
      - uses: ./.github/actions/install-clap-validator

      # ⛔ One test is excluded, and the exclusion is not a shrug.
      #
      # `param-conversions` divides by the parameter count and this plugin
      # deliberately has none, so the *validator* panics: "attempt to divide by
      # zero. This is a bug in the validator". Nothing to fix on our side.
      #
      # `state-invalid-random` used to be excluded beside it, because nih-plug
      # aborted the whole process on a malformed state blob. TASK-P14 fixed that
      # on our fork and **deleted the exclusion**, which is what makes the fix
      # provable: the test runs, and it passes.
      #
      # **Delete each exclusion the moment its cause is gone.** A permanently
      # skipped test is the "green and blind" gate this repo has been caught by
      # five times.
      - name: clap-validator
        shell: bash
        run: |
          set -euo pipefail
          "$CLAP_VALIDATOR" validate \
            --exclude '^param-conversions$' \
            "target/bundled/Freally MIDI Master.clap"

  # TASK-P12. Separate from `plugin` above because Linux is not a shipping
  # target yet — this job does not build bundles or run the validator, it
  # answers the one question the editor exists to raise: **does the window
  # actually draw anything?**
  #
  # A `cargo build` on this runner goes green whether GTK starts, whether the
  # webview is ever constructed and whether the page is ever fetched. Every one
  # of those failures is an empty window, and the only way to tell an empty
  # window from a working one is to photograph it and count the colours — which
  # is what the script does, and which was watched failing before it was trusted.
  #
  # ✅ **WINDOWS IS IN THIS MATRIX AS OF TASK-P16.** It was held out because the
  # Windows *standalone* opened a blank window: `baseview`'s `open_blocking`
  # pumps with a non-NULL `hwnd`, which never retrieves thread messages, and
  # WebView2 delivers its COM completions as exactly those — so the custom
  # protocol handler was never dispatched and devtools reported `about:blank`.
  # The vendored adapter now drains the queue from `on_frame`, off unless the
  # process opts in. This leg is what keeps that fixed: it is the only thing
  # standing between a regression there and a silently blank window shipping.
  #
  # **macOS is in, and is genuinely unproven.** WKWebView does not depend on the
  # message loop the way WebView2 does, so the Windows cause probably does not
  # apply — but nobody has run it, and this job is how that gets answered rather
  # than assumed. If it goes red, that is a finding to act on, not a state to
  # leave.
  plugin-editor:
    name: plugin editor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # webkit2gtk is what wry's Linux backend links; the xcb/xkb set is what
      # baseview's X11 backend needs; libjack is pulled in by nih-plug's
      # `standalone` feature; xvfb and xdotool are how a headless runner sees a
      # window at all. macOS needs none of it — WKWebView and CoreAudio ship with
      # the OS, and `screencapture` is built in.
      #
      # ⛔ `imagemagick` is here for `import`, which is how the Linux capture
      # takes the window. It was briefly removed on the grounds that the *colour
      # count* no longer needs `identify` — true, and irrelevant: `import` is
      # ImageMagick too, and the leg failed without it.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-util-dev \
            libxcursor-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            xvfb \
            xdotool \
            imagemagick

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - uses: Swatinem/rust-cache@v2
        with:
          key: plugin-editor-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `dist/` is gitignored and compiled into the binary with `include_dir!`,
      # so the frontend build has to happen before cargo, not alongside it.
      - run: npm run build

      - name: Build the standalone
        run: cargo build -p freally-midi-master-plugin --release

      # Linux runners have no display, so the app gets a virtual one. The macOS
      # runner has a real window server already.
      - name: Photograph the editor (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run -a --server-args="-screen 0 1600x1000x24" \
            node scripts/screenshot-plugin.mjs screenshots/linux-plugin.png

      - name: Photograph the editor (macOS)
        if: matrix.os == 'macos-latest'
        run: node scripts/screenshot-plugin.mjs screenshots/macos-plugin.png

      # The runner has a real window station, so no virtual display is needed.
      # ⛔ This leg is the regression gate for TASK-P16 — a blank window here
      # means the message pump stopped reaching WebView2 again, and the script
      # refuses a flat window, so a pass is real rather than "it built".
      - name: Photograph the editor (Windows)
        if: matrix.os == 'windows-latest'
        run: node scripts/screenshot-plugin.mjs screenshots/windows-plugin.png

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: plugin-editor-screenshot-${{ matrix.os }}
          path: screenshots/

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - uses: Swatinem/rust-cache@v2
        with:
          key: supply-chain

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # Vulnerabilities only. The "unmaintained" advisories are owned by
      # deny.toml, which records each one with a dated justification —
      # `--deny warnings` here would duplicate that policy and disagree with it.
      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check

      - name: npm audit
        run: npm audit --audit-level=high

      # The invariant the whole product rests on: no AI, and nothing that can
      # reach the network from the shipped binary.
      - name: AI and network denylist
        run: node scripts/check-denylist.mjs
