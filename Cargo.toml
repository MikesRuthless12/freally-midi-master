[workspace]
members = [
    "engine",
    "plugin",
    "plugin/vendor/nih-plug-webview",
    "tools/datasetc",
    "tools/kitgen",
]
resolver = "2"

# ⛔ **Kept after the desktop app was removed, and the reason changed rather
# than expired.** It was here for the crash-notice gate (`cfg!(panic = "abort")`)
# in a crate that no longer exists. It stays because this is a *plugin*: a
# panic unwinding across the `extern "C"` boundary into a host is undefined
# behaviour, so aborting is the defined outcome. That is also why the three
# panics closest to that boundary were turned into errors rather than left to
# be caught — with `abort`, nothing can catch them.
[profile.release]
panic = "abort"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Mike Weaver"]
license = "LicenseRef-AllRightsReserved"
repository = "https://github.com/MikesRuthless12/freally-midi-master"
